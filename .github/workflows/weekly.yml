name: 科技周报

# 触发方式
on:
  schedule:
    # cron 用的是 UTC 时间（北京时间 = UTC+8）。
    #   5 4 * * 1  →  每周一 04:05 UTC  =  北京时间周一 12:05
    #
    # 为什么是 12:05 而不是早上：
    #   DeepSeek 的高峰时段是北京时间周一至周五 9:00-12:00、14:00-18:00，
    #   价格是空闲时段的两倍。12:05 正好落在 12:00-14:00 的空档里，
    #   一次运行 3~4 分钟，跑完也不会跨进 14:00 的高峰。
    #   改成早上 9 点跑 = 每期多花一倍钱，没有别的好处。
    #
    # 注意：GitHub 的定时任务不保证准时，高峰时段可能延迟十几分钟甚至更久。
    #       即使延迟到 12:20 也无所谓——离 14:00 高峰还有很久。
    - cron: "5 4 * * 1"

    # 兜底补跑：周一 05:20 UTC = 北京时间 13:20。
    #   12:05 那次成功了 → 这一步什么都不做（只读一个文件就退出，零 token）。
    #   失败了（红/降级/被额度拦）→ 立刻补一期，让你中午就能收到。
    #   仍是谷时（12:00-14:00），补跑也只花一半钱。
    - cron: "20 5 * * 1"

  # 允许手动触发：仓库页面 → Actions → 左侧选这个 workflow → Run workflow
  # 第一次配置时强烈建议先用它跑一次，别等周一。
  workflow_dispatch:

# 需要写权限，才能把生成的周报提交回仓库
permissions:
  contents: write

# 防止两次运行撞在一起（比如手动触发时正好赶上定时任务）
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 本项目零第三方依赖（只用标准库），所以不需要缓存 pip

      # 离线自检：全部在本地跑，不联网、不调用模型、不花一个 token，几秒完成。
      # 为什么放在花钱那步之前：渲染、筛选、截断这些纯逻辑最容易在改动时被弄坏，
      # 而它们坏了以后"看起来"照样能跑——报告少了一段、推送被服务端拒掉，都不会报错。
      # 任何一项失败就让整次运行变红，比周一中午收到一份残缺周报强。
      - name: 离线自检
        run: |
          python probe/test_plain.py
          python probe/test_screening.py
          python probe/test_notify.py
          python probe/test_if_missing.py
          python probe/test_allocate.py
          python probe/test_budget.py
          python probe/test_injection.py

      - name: 生成周报
        env:
          # Key 存在 GitHub Secrets 里，不要写进代码。
          # 设置位置：仓库 → Settings → Secrets and variables → Actions → New repository secret
          # 名称必须是 DEEPSEEK_API_KEY
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Server 酱的 SendKey（微信推送）。没配也不影响周报生成，只是收不到推送。
          # 设置位置同上，名称必须是 WECHAT_SENDKEY。
          WECHAT_SENDKEY: ${{ secrets.WECHAT_SENDKEY }}
          # 让 datetime.now() 和 date.today() 用北京时间，
          # 否则报告上的日期和额度周期都会按 UTC 算，会差 8 小时。
          TZ: Asia/Shanghai
          # GitHub 自动提供的一次性令牌，用来查"本周新建且高星的仓库"（开源板块）。
          # 不带它也能查，只是限额低（每小时 60 次），偶尔会和别的任务撞上限。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 代码会通过这个变量识别"我在 GitHub 上跑"，
          # 从而启用直连模式：所有源都直连，不检测代理、不跳过英文源。
          GITHUB_ACTIONS: "true"
        # 周一 12:05 那次：什么都不加，正常生成。
        # 周一 13:20 那次：自动加上 --if-missing（今天的周报已存在就直接退出，
        #   不花钱也不推送；没生成才补跑一期）。
        #
        # 为什么用表达式而不是 shell 里的 if：这里的 ${{ }} 由 GitHub 在开跑之前
        # 就算好，只剩下一条平铺直叙的命令，不存在 bash 方言/缩进出错的可能。
        # 手动触发（workflow_dispatch）时 github.event.schedule 是空串，同样走正常生成。
        run: python main.py ${{ github.event.schedule == '20 5 * * 1' && '--if-missing' || '' }}

      - name: 查看额度
        if: always()
        env:
          TZ: Asia/Shanghai
        run: python main.py --check-budget
        continue-on-error: true

      - name: 把周报和额度账本提交回仓库
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 周报 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 上传周报为附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/
          # 附件保留 30 天，过期就没了。
          # 长期保存依靠上面「提交回仓库」那一步。
          retention-days: 30
