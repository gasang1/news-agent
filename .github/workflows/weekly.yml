name: 科技周报

# 触发方式
on:
  schedule:
    # cron 用的是 UTC 时间（北京时间 = UTC+8）。
    #
    # ⚠️ 2026-10-19 的教训：原来只写周一 12:05 和 13:20 两个 cron，
    #    结果这一天 GitHub 两个都没触发（仓库里 11 次运行全是手动触发的），
    #    中午什么都没发生。GitHub 的定时任务是"尽力而为"：高峰期可能延迟
    #    几十分钟，也可能整次丢弃，而且不会有任何报错。
    #
    # 所以现在改成**每天**看一眼（周一到周日，12:05 和 13:20 各一次）：
    #   本周已经有周报 → 读一个文件就退出，零 token（脚本里的 --if-week-missing）
    #   本周还没有     → 立刻生成一期
    # 这样周一那次被丢掉，周二到周日任何一次都还能补上——最多晚一天，不是晚一周。
    # 成本不变：正常一周只有一次真正干活，其余六次都是几秒钟的空跑。
    #
    #   5 4 * * *  →  每天 04:05 UTC = 北京时间 12:05
    #  20 5 * * *  →  每天 05:20 UTC = 北京时间 13:20（当天的第二次机会）
    #
    # 为什么是 12:05 而不是早上：DeepSeek 的高峰时段是北京时间周一至周五
    #   9:00-12:00、14:00-18:00，价格是空闲时段的两倍。12:05 落在 12:00-14:00
    #   的空档里，一次运行 3~6 分钟，跑完也不会跨进 14:00。
    - cron: "5 4 * * *"

    # 当天第二次机会：12:05 那次红了、超时了、被额度拦了，这里补一次。
    - cron: "20 5 * * *"

    # ⚠️ 一次性验证用（2026-10-19 14:17 北京时间）：跑完立刻删掉这一条。
    # 目的是证明"GitHub 到底会不会自己触发定时任务"——之前的 12 次运行全是
    # 手动触发的，schedule 事件一次都没有。这一条如果触发了，说明定时器是好的，
    # 只是周一那两个 cron 被丢了；如果没有触发，说明外部定时器兜底必须做。
    # 下面 run 那行的表达式会让这一次**跳过"本周已有周报就退出"的闸门**，
    # 强制真跑一期，这样顺手就能看到"由 GitHub 定时自动生成的周报 + 微信推送"。
    - cron: "17 6 * * *"

  # 允许手动触发：仓库页面 → Actions → 左侧选这个 workflow → Run workflow
  # 怀疑定时任务没跑的时候，用它可以立刻验证一次。
  workflow_dispatch:

# 需要写权限，才能把生成的周报提交回仓库
permissions:
  contents: write

# 防止两次运行撞在一起（比如手动触发时正好赶上定时任务）
concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 本项目零第三方依赖（只用标准库），所以不需要缓存 pip

      # 离线自检：全部在本地跑，不联网、不调用模型、不花一个 token，几秒完成。
      # 为什么放在花钱那步之前：渲染、筛选、截断这些纯逻辑最容易在改动时被弄坏，
      # 而它们坏了以后"看起来"照样能跑——报告少了一段、推送被服务端拒掉，都不会报错。
      # 任何一项失败就让整次运行变红，比周一中午收到一份残缺周报强。
      - name: 离线自检
        run: |
          python probe/test_plain.py
          python probe/test_screening.py
          python probe/test_notify.py
          python probe/test_if_missing.py
          python probe/test_allocate.py
          python probe/test_budget.py
          python probe/test_injection.py

      - name: 生成周报
        env:
          # Key 存在 GitHub Secrets 里，不要写进代码。
          # 设置位置：仓库 → Settings → Secrets and variables → Actions → New repository secret
          # 名称必须是 DEEPSEEK_API_KEY
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Server 酱的 SendKey（微信推送）。没配也不影响周报生成，只是收不到推送。
          # 设置位置同上，名称必须是 WECHAT_SENDKEY。
          WECHAT_SENDKEY: ${{ secrets.WECHAT_SENDKEY }}
          # 让 datetime.now() 和 date.today() 用北京时间，
          # 否则报告上的日期和额度周期都会按 UTC 算，会差 8 小时。
          TZ: Asia/Shanghai
          # GitHub 自动提供的一次性令牌，用来查"本周新建且高星的仓库"（开源板块）。
          # 不带它也能查，只是限额低（每小时 60 次），偶尔会和别的任务撞上限。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 代码会通过这个变量识别"我在 GitHub 上跑"，
          # 从而启用直连模式：所有源都直连，不检测代理、不跳过英文源。
          GITHUB_ACTIONS: "true"
        # 定时触发（schedule）：一律带上 --if-week-missing。
        #   本周已经有周报 → 只读一个文件就退出，零 token、不推送；
        #   本周还没有     → 正常生成一期。
        #   为什么不是"周一正常跑、13:20 再补"：2026-10-19 两个 cron 全被 GitHub
        #   丢了，押注单次 cron 等于把整周的周报交给运气。现在每天都来看，
        #   周一的被丢掉，周二还能补上。
        # 手动触发（workflow_dispatch）：不加任何参数，强制重新生成一期
        #   ——手动触发就是为了"我现在就要"，不该被当成偷懒的定时任务。
        #
        # 为什么用表达式而不是 shell 里的 if：这里的 ${{ }} 由 GitHub 在开跑之前
        # 就算好，只剩下一条平铺直叙的命令，不存在 bash 方言/缩进出错的可能。
        run: python main.py ${{ (github.event_name == 'schedule' && github.event.schedule != '17 6 * * *') && '--if-week-missing' || '' }}

      - name: 查看额度
        if: always()
        env:
          TZ: Asia/Shanghai
        run: python main.py --check-budget
        continue-on-error: true

      - name: 把周报和额度账本提交回仓库
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports state
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 周报 $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 上传周报为附件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/
          # 附件保留 30 天，过期就没了。
          # 长期保存依靠上面「提交回仓库」那一步。
          retention-days: 30
